# Compare 8-bit shrinking (run by hand from the Actions tab). Tries shrinking each Gallery Plus
# model in different ways and reports size, speed (with and without XNNPACK) and accuracy on
# the run page, on an Arm machine like a phone's processor. It changes nothing the app ships; see
# scripts/compare_quantization.py.
name: Compare 8-bit shrinking

on:
  workflow_dispatch:

jobs:
  # The published ONNX Runtime for Python has no XNNPACK, so one is built with it (once; cached).
  xnnpack-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: cache
        uses: actions/cache@v4
        with:
          path: wheel
          key: onnxruntime-1.20.1-xnnpack-py312-arm64

      - name: Build ONNX Runtime with XNNPACK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet numpy packaging wheel setuptools
          git clone --quiet --depth 1 --branch v1.20.1 https://github.com/microsoft/onnxruntime
          # Same Eigen archive fix as scripts/plus/build.sh.
          sed -i 's/be8be39fdbc6e60e94fa7870b280707069b5b81a/32b145f525a8308d7ab1c09388b2e288312d8eba/' onnxruntime/cmake/deps.txt
          # GitLab re-generated KleidiAI's v0.2.0 archive (XNNPACK's Arm routines) the same way.
          grep -rl b1e3173992fd91f20db904ab77d6e901778c2681 onnxruntime/cmake | xargs -r sed -i 's/b1e3173992fd91f20db904ab77d6e901778c2681/61886eac853e2235359cbcc73c5830b8abf71467/'
          grep -rn 61886eac853e2235359cbcc73c5830b8abf71467 onnxruntime/cmake
          python3 onnxruntime/tools/ci_build/build.py --build_dir ort-build --config Release \
            --build_wheel --use_xnnpack --parallel --skip_tests --skip_submodule_sync \
            --compile_no_warning_as_error --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF
          mkdir -p wheel && cp ort-build/Release/dist/*.whl wheel/

      - uses: actions/upload-artifact@v4
        with:
          name: xnnpack-runtime
          path: wheel

  compare:
    needs: xnnpack-runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: xnnpack-runtime
          path: wheel

      - name: Install tools
        run: |
          python3 -m pip install --quiet wheel/*.whl "onnx==1.17.0" "pillow>=10.1" numpy tokenizers
          python3 -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"

      # The same downloads and pinned checks as the Plus build.
      - name: Download models
        run: |
          mkdir -p work/download
          grep -v '^#' scripts/plus/models.txt | while read -r name url sha; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -o "work/download/$name" "$url"
            actual=$(sha256sum "work/download/$name" | cut -d' ' -f1)
            if [ "$sha" != "unpinned" ] && [ "$sha" != "$actual" ]; then echo "::error::$name has sha256 $actual, expected $sha"; exit 1; fi
          done

      # OpenCV's sample photos, used only for calibrating and measuring here.
      - name: Download sample photos
        run: |
          mkdir -p work/photos
          for f in lena.jpg messi5.jpg baboon.jpg fruits.jpg building.jpg home.jpg starry_night.jpg butterfly.jpg \
                   apple.jpg orange.jpg aero1.jpg aero3.jpg HappyFish.jpg LinuxLogo.jpg WindowsLogo.jpg \
                   imageTextN.png imageTextR.png sudoku.png chicky_512.png licenseplate_motion.jpg smarties.png \
                   text_motion.jpg board.jpg notes.png graf1.png box_in_scene.png basketball1.png left01.jpg \
                   right01.jpg pic1.png pic3.png pic5.png; do
            curl -fsSL --retry 3 -o "work/photos/$f" "https://raw.githubusercontent.com/opencv/opencv/4.10.0/samples/data/$f" || rm -f "work/photos/$f"
          done
          ls work/photos | wc -l

      - name: Compare
        run: python3 scripts/compare_quantization.py work/download work/photos work/trial
